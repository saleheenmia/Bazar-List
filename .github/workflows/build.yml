name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android project
        run: flutter create --org com.example --project-name bazar_list --platforms=android build_app

      - name: Copy app code
        run: |
          rm -rf build_app/lib build_app/test build_app/analysis_options.yaml
          cp -r lib build_app/lib
          cp pubspec.yaml build_app/pubspec.yaml

      - name: Set app name
        run: |
          sed -i 's/android:label="[^"]*"/android:label="বাজারের তালিকা"/' build_app/android/app/src/main/AndroidManifest.xml

      - name: Set app icon
        working-directory: build_app
        run: |
          cp ../icon.png icon.png
          flutter pub add --dev flutter_launcher_icons
          printf '\nflutter_launcher_icons:\n  android: true\n  ios: false\n  image_path: "icon.png"\n' >> pubspec.yaml
          dart run flutter_launcher_icons

      - name: Build APK
        working-directory: build_app
        run: |
          flutter pub get
          flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: bazar-list-apk
          path: build_app/build/app/outputs/flutter-apk/app-release.apk
